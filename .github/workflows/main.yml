name: Deploy Monthly Expense

on:
  push:
    branches:
      - main
      - staging

jobs:
  runner-1:
    runs-on: ubuntu-latest
    env:
      BEAM_TOKEN: ${{ secrets.BEAM_TOKEN }}

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install Beam
        run: |
          python -m pip install --upgrade pip
          python -m pip install "beam-client==0.2.207"

      - name: Configure Beam
        run: |
          beam configure default --token "$BEAM_TOKEN"

      - name: Deploy
        run: |
          beam deploy \
            --name monthly-expense-1 \
            --gpu RTX4090 \
            --gpu-count 1 \
            mui.py.momo
