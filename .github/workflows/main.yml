name: Deploy Monthly Expense

on:
  push:
    branches:
      - main
      - staging

jobs:
  runner-1:
    runs-on: ubuntu-latest
    env:
      BEAM_TOKEN: ${{ secrets.BEAM_TOKEN }}

    steps:
      - uses: actions/checkout@v4

      - name: Check source files
        run: |
          echo "=== CURRENT DIRECTORY ==="
          pwd

          echo "=== FILES ==="
          find . -maxdepth 2 -type f -print

          echo "=== CHECK mui.py ==="
          test -f mui.py && echo "mui.py OK" || exit 1

          echo "=== CHECK script.sh ==="
          test -f script.sh && echo "script.sh OK" || exit 1

          echo "=== SCRIPT PERMISSION ==="
          ls -l script.sh

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install Beam
        run: |
          python -m pip install --upgrade pip
          python -m pip install "beam-client==0.2.207"

      - name: Check Beam token
        run: |
          if [ -z "$BEAM_TOKEN" ]; then
            echo "BEAM_TOKEN tidak tersedia"
            exit 1
          fi
          echo "BEAM_TOKEN tersedia"

      - name: Configure Beam
        run: |
          beam configure default --token "$BEAM_TOKEN"

      - name: Deploy
        run: |
          beam deploy \
            --name monthly-expense-1 \
            --cpu 4 \
            mui.py:momo


